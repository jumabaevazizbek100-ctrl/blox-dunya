<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slap Tower — Blox Dunyo</title>
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#101317;--panel:rgba(26,31,38,.94);--raised:#232a33;--line:#394552;--text:#f2f4f7;--muted:#a5afbb;--accent:#3db8a5;--gold:#ffd34d;--danger:#ff6b6b}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.35 Inter,Roboto,system-ui,sans-serif;overflow:hidden;touch-action:none}button,input{font:inherit}button{min-height:44px;border:0;border-radius:11px;background:var(--raised);color:var(--text);font-weight:700;padding:0 13px}button:active{filter:brightness(1.3);transform:scale(.97)}button:disabled{opacity:.45}#server{display:none}input{height:42px;border:1px solid var(--line);border-radius:10px;background:#0e1115;color:var(--text);padding:0 10px;min-width:0}#app{height:100%;display:flex;flex-direction:column}#top{display:flex;align-items:center;gap:8px;min-height:58px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:4}#top h1{font-size:18px;margin:0;white-space:nowrap}#status{display:flex;align-items:center;gap:6px;flex:1;color:var(--muted);font-size:12px;min-width:0}#dot{width:10px;height:10px;border-radius:50%;background:var(--danger);flex:none}#dot.ok{background:var(--accent)}#top a{color:var(--text);text-decoration:none;font-weight:700}#game{position:relative;flex:1;min-height:0}#game canvas{display:block;width:100%;height:100%}#hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:14px;background:rgba(18,25,34,.86);font-weight:800;white-space:nowrap;z-index:2}#hud b{color:var(--gold)}#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--accent);color:#06231f;font-weight:800;border-radius:10px;padding:9px 14px;display:none;z-index:5;max-width:90%;text-align:center}.panel{position:absolute;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 30px #0008;padding:10px}.panel h2{font-size:14px;margin:0 0 8px}.panel small{color:var(--muted)}#join{display:none;inset:12px auto auto 12px;width:min(330px,calc(100% - 24px))}#join .row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}#join .wide{width:100%;margin-top:7px}#join.hide{display:none}#join details{margin-top:8px;color:var(--muted)}#join summary{cursor:pointer}#controls{left:12px;bottom:12px;display:flex;gap:8px;align-items:end;background:transparent;border:0;box-shadow:none;padding:0}#joy{width:132px;height:132px;border-radius:66px;background:#f2f4f724;border:2px solid #f2f4f7aa;position:relative;touch-action:none}#joy:after{content:'YURISH';position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:10px;font-weight:800;color:var(--muted)}#thumb{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:25px;background:var(--accent);box-shadow:0 4px 12px #0006}#actions{display:flex;flex-direction:column;gap:8px}#actions button{min-width:86px}#rotL,#rotR{min-width:42px;padding:0;font-size:24px}#slap{background:#f25c5c;color:#260808;font-size:17px}#jump{background:var(--accent);color:#06231f}#gear{right:12px;bottom:12px;width:min(240px,calc(100% - 24px));display:none}#gear.open{display:block}#gearList{display:flex;gap:6px;flex-wrap:wrap}#gearList button.active{background:var(--accent);color:#06231f}#admin{right:12px;top:12px;width:min(290px,calc(100% - 24px));display:none}#admin.open{display:block}#admin .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.players{position:absolute;right:12px;top:68px;z-index:2;background:#121922bf;padding:7px 10px;border-radius:10px;max-width:180px;color:var(--muted);font-size:12px}.players b{color:var(--text);display:block;margin-bottom:3px}.hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);color:#dce3ea99;font-size:12px;pointer-events:none;white-space:nowrap}@media(max-width:600px){#top h1{font-size:15px}#status{font-size:11px}.players{top:64px}.hint{display:none}#controls{bottom:10px}.panel{padding:8px}}
</style>
</head>
<body>
<div id="app">
<header id="top"><h1>🖐 Slap Tower</h1><div id="status"><i id="dot"></i><span id="statusText">Ulanmagan</span></div><button id="invite" aria-label="Invite">Invite</button><button id="gearToggle" aria-label="Gear">Gear</button><button id="adminToggle" aria-label="Admin">Admin</button><a href="index.html" aria-label="Blox Dunyo">✕</a></header>
<main id="game"><div id="hud"><span id="roomLabel">ROOM —</span><span>◎ <b id="coins">0</b></span><span id="selectedLabel">Slap</span></div><div id="toast" role="status"></div><div id="players" class="players"><b>Playerlar</b><span id="playerList">—</span></div>
<section id="join" class="panel"><h2>Multiplayer’ga kirish</h2><small>Render WebSocket URL manzilini kiriting.</small><div class="row"><input id="name" maxlength="18" placeholder="Ismingiz" value="Player"><input id="room" maxlength="20" placeholder="Room" value="MAIN"></div><select id="event" class="wide"><option value="classic">Classic Tower</option><option value="lava-rises">Lava rises</option><option value="low-gravity">Low gravity</option><option value="speed-round">Speed round</option><option value="last-standing">Last standing</option></select><input id="server" class="wide" placeholder="wss://sizning-render-hostingiz/ws"><details><summary>Server URL ni saqlash</summary><small>URL brauzer xotirasida saqlanadi. Tokenni bu yerga yozmang.</small></details><button id="connect" class="wide">Ulanish</button></section>
<section id="gear" class="panel"><h2>Gear</h2><div id="gearList"><button data-gear="slap" class="active">🖐 Slap</button><button data-gear="hook">🪝 Hook</button><button data-gear="cape">🧥 Cape</button><button data-gear="laser">⚡ Laser</button><button data-gear="fly">🪽 Fly</button><button data-gear="speed">💨 Speed</button><button data-gear="jump">⬆ Jump</button></div></section>
<section id="admin" class="panel"><h2>Admin panel</h2><input id="adminToken" class="wide" type="password" placeholder="Admin token"><input id="adminTarget" class="wide" placeholder="Target player ID"><div class="row"><button data-command="freeze">Freeze</button><button data-command="unfreeze">Unfreeze</button><button data-command="kick">Kick</button></div><input id="announcement" class="wide" placeholder="Announcement"><button id="announce" class="wide">E’lon yuborish</button></section>
<div id="controls"><div id="joy" aria-label="Harakat joystick"><div id="thumb"></div></div><div id="actions"><button id="slap">SLAP</button><button id="jump">JUMP</button><button id="rotL" aria-label="Chapga burilish">↺</button><button id="rotR" aria-label="O‘ngga burilish">↻</button></div></div><div class="hint">Joystick bilan yuring • yaqin playerga SLAP bosing</div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), params=new URLSearchParams(location.search), state={ws:null,id:null,room:'',event:'classic',players:new Map(),gear:new Set(['slap']),selected:'slap',joy:{x:0,y:0},keys:{},yaw:0,lastInput:0,connected:false,scene:null,camera:null,renderer:null,meshes:new Map(),fx:[],hitUntil:new Map()};
const DEFAULT_WS='wss://blox-dunya.onrender.com/ws';const savedServer=localStorage.getItem('bloxDunyoServer')||DEFAULT_WS;$('#server').value=params.get('server')||savedServer;$('#room').value=(params.get('room')||'MAIN').toUpperCase();if(params.get('event'))$('#event').value=params.get('event');
const labels={uz:{connected:'Ulandi',connecting:'Ulanmoqda…',disconnected:'Ulanmagan',slap:'Slap',hit:'Slap tegdi!',kicked:'Admin chiqarib yubordi'},en:{connected:'Connected',connecting:'Connecting…',disconnected:'Disconnected',slap:'Slap',hit:'Slap landed!',kicked:'Removed by admin'}};let lang=localStorage.getItem('bloxDunyoLang')||'uz';const t=k=>(labels[lang]||labels.uz)[k]||k;
function toast(text){const e=$('#toast');e.textContent=text;e.style.display=text?'block':'none';clearTimeout(toast.timer);if(text)toast.timer=setTimeout(()=>e.style.display='none',2600)}
function status(text,ok=false){$('#statusText').textContent=text;$('#dot').classList.toggle('ok',ok)}
function send(msg){if(state.ws&&state.ws.readyState===WebSocket.OPEN)state.ws.send(JSON.stringify(msg))}
function connect(){const url=$('#server').value.trim();if(!/^wss?:\/\/[^\s]+\/ws(?:\?.*)?$/i.test(url)){toast('Server URL: wss://host/ws');return}if(state.ws)state.ws.close();localStorage.setItem('bloxDunyoServer',url);status(t('connecting'));const ws=new WebSocket(url);state.ws=ws;ws.onopen=()=>{status(t('connected'),true);send({type:'join',room:$('#room').value.trim()||'MAIN',name:$('#name').value.trim()||'Player',event:$('#event').value})};ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(err){console.warn(err)}};ws.onerror=()=>{status('WebSocket xatosi')};ws.onclose=()=>{state.connected=false;status(t('disconnected'));state.id=null;state.players.clear();renderPlayers()}}
function handle(m){if(m.type==='joined'){state.connected=true;state.id=m.playerId;state.room=m.room;state.event=m.event||'classic';state.players.clear();(m.players||[]).forEach(p=>state.players.set(p.id,p));$('#roomLabel').textContent='ROOM '+m.room+' • '+state.event;$('#join').classList.add('hide');renderPlayers();toast('Room '+m.room+' ga kirdingiz')}else if(m.type==='player_joined'){state.players.set(m.player.id,m.player);renderPlayers();toast(m.player.name+' qo‘shildi')}else if(m.type==='player_left'){state.players.delete(m.playerId);renderPlayers()}else if(m.type==='state'){state.players.clear();(m.players||[]).forEach(p=>state.players.set(p.id,p));renderPlayers()}else if(m.type==='hit'){state.hitUntil.set(m.targetId,performance.now()+650);burstFor(m.targetId,0xf25c5c);if(m.targetId===state.id)toast(t('hit')+' +'+(m.reward||0));else if(m.attackerId===state.id)toast('SLAP! +'+(m.reward||0))}else if(m.type==='reward'){toast('+'+m.amount+' coin • jami '+m.coins)}else if(m.type==='checkpoint'){toast('Checkpoint '+m.stage+' • +'+m.reward+' coin')}else if(m.type==='round'){state.event=m.event;$('#roomLabel').textContent='ROOM '+state.room+' • '+state.event;toast('Round: '+m.event)}else if(m.type==='gear_used'){if(m.playerId===state.id)toast(m.gear+' ishlatildi')}else if(m.type==='admin_update'){toast(m.command+' bajarildi')}else if(m.type==='announcement'){toast('📢 '+m.message)}else if(m.type==='kicked'){toast(t('kicked'));state.ws?.close()}else if(m.type==='error'){toast(m.message||m.code)}}
function renderPlayers(){const arr=[...state.players.values()];$('#playerList').textContent=arr.length?arr.map(p=>(p.id===state.id?'★ ':'')+p.name+' Lv.'+(p.stage||0)+(p.frozen?' 🔒':'')).join(' • '):'—';const me=state.players.get(state.id);if(me)$('#coins').textContent=me.coins||0}
function target(){const me=state.players.get(state.id);if(!me)return null;let best=null,d=4.2;for(const p of state.players.values()){if(p.id===state.id||!p.alive||p.frozen)continue;const n=Math.hypot(p.x-me.x,p.z-me.z);if(n<d){d=n;best=p}}return best}
function slap(){const p=target();if(!p){toast('Yaqin player yo‘q');return}send({type:'action',action:'slap',target:p.id})}
function action(name){if(name==='slap'){slap();return}if(name==='jump'){send({type:'action',action:'jump'});return}if(!state.gear.has(name)){toast('Bu gear hali ochilmagan');return}send({type:'action',action:name});}
const towerPoints=Array.from({length:22},(_,k)=>({x:Math.cos(k*.62)*8,z:Math.sin(k*.62)*8}));function inputLoop(now){if(state.connected&&now-state.lastInput>55){let x=state.joy.x+(state.keys.d?1:0)-(state.keys.a?1:0),z=state.joy.y+(state.keys.s?1:0)-(state.keys.w?1:0);const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}if(Math.abs(x)+Math.abs(z)>.08){send({type:'input',x,z})}const me=state.players.get(state.id);const next=(me?.stage||0)+1,p=towerPoints[next-1];if(me&&p&&Math.hypot(me.x-p.x,me.z-p.z)<3.8)send({type:'action',action:'checkpoint',stage:next});state.lastInput=now}requestAnimationFrame(inputLoop)}requestAnimationFrame(inputLoop);
function setupScene(){const game=$('#game');const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(game.clientWidth,game.clientHeight,false);r.shadowMap.enabled=true;game.insertBefore(r.domElement,game.firstChild);const s=new THREE.Scene();s.background=new THREE.Color(0x8fd8ff);s.fog=new THREE.Fog(0x8fd8ff,30,95);const c=new THREE.PerspectiveCamera(55,game.clientWidth/game.clientHeight,.1,300);s.add(new THREE.HemisphereLight(0xeafaff,0x56677c,1.3));const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(8,18,10);dl.castShadow=true;s.add(dl);const floor=new THREE.Mesh(new THREE.BoxGeometry(60,.4,60),new THREE.MeshStandardMaterial({color:0x303944}));floor.position.y=-.2;floor.receiveShadow=true;s.add(floor);s.add(new THREE.GridHelper(60,30,0x526172,0x3b4551));state.scene=s;state.camera=c;state.renderer=r;addTower();new ResizeObserver(()=>{r.setSize(game.clientWidth,game.clientHeight,false);c.aspect=game.clientWidth/game.clientHeight;c.updateProjectionMatrix()}).observe(game);requestAnimationFrame(render)}
function addTower(){for(let k=0;k<22;k++){const a=k*.62,x=Math.cos(a)*8,z=Math.sin(a)*8,y=1+k*.75;const m=new THREE.Mesh(new THREE.BoxGeometry(k%5===0?4:3,1,k%5===0?4:3),new THREE.MeshStandardMaterial({color:k===21?0xffd34d:k%5===0?0x5cd08a:0x5c9cf2}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;state.scene.add(m)}}
function avatar(p){const g=new THREE.Group();const shirt=new THREE.MeshStandardMaterial({color:p.id===state.id?0x3db8a5:0xf2b84b});const skin=new THREE.MeshStandardMaterial({color:0xe8c9a0});const mk=(w,h,d,mat,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.y=y;m.castShadow=true;g.add(m)};mk(.8,.9,.45,shirt,1.2);mk(.55,.5,.5,skin,1.9);mk(.25,.8,.25,shirt,-.1);mk(.25,.8,.25,shirt,-.1);return g}
function syncAvatars(){for(const [id,m] of state.meshes){if(!state.players.has(id)){state.scene.remove(m);state.meshes.delete(id)}}for(const p of state.players.values()){let m=state.meshes.get(p.id);if(!m){m=avatar(p);state.scene.add(m);state.meshes.set(p.id,m)}const hit=Math.max(0,(state.hitUntil.get(p.id)||0-performance.now())/650);m.position.set(p.x,p.y+Math.sin(hit*Math.PI)*1.5,p.z);m.rotation.y=Math.atan2(p.vx,p.vz)+hit*10;m.rotation.z=hit*1.3;m.scale.setScalar((p.frozen?.88:1)*(1+hit*.18))}}
function burstFor(id,color){const p=state.players.get(id);if(!p||!state.scene)return;for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color}));m.position.set(p.x,p.y+1,p.z);m.userData={life:.65,vx:(Math.random()-.5)*5,vy:Math.random()*4,vz:(Math.random()-.5)*5};state.scene.add(m);state.fx.push(m)}}
function render(now){syncAvatars();const me=state.players.get(state.id)||{x:0,y:0,z:0};const offX=Math.sin(state.yaw)*21,offZ=Math.cos(state.yaw)*21;state.camera.position.lerp(new THREE.Vector3(me.x+offX,me.y+11,me.z+offZ),.08);state.camera.lookAt(me.x,me.y+1,me.z);for(let i=state.fx.length-1;i>=0;i--){const m=state.fx[i],u=m.userData;u.life-=.016;m.position.x+=u.vx*.016;m.position.y+=u.vy*.016;u.vy-=8*.016;m.position.z+=u.vz*.016;if(u.life<=0){state.scene.remove(m);m.material.dispose();state.fx.splice(i,1)}}state.renderer.render(state.scene,state.camera);requestAnimationFrame(render)}
function bindJoystick(){const j=$('#joy'),th=$('#thumb');let active=false;function move(e){const r=j.getBoundingClientRect(),rad=r.width/2-25;let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.hypot(x,y);if(l>rad){x*=rad/l;y*=rad/l}state.joy={x:x/rad,y:y/rad};th.style.transform=`translate(${x}px,${y}px)`}function end(){active=false;state.joy={x:0,y:0};th.style.transform=''}j.addEventListener('pointerdown',e=>{active=true;j.setPointerCapture(e.pointerId);move(e)});j.addEventListener('pointermove',e=>{if(active)move(e)});j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end)}
$('#connect').onclick=connect;$('#invite').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('room',state.room||$('#room').value.trim()||'MAIN');if($('#server').value)url.searchParams.set('server',$('#server').value);try{await navigator.clipboard.writeText(url.href);toast('Invite link nusxalandi')}catch{prompt('Invite link',url.href)}};$('#slap').onclick=()=>action('slap');$('#jump').onclick=()=>action('jump');$('#gearToggle').onclick=()=>$('#gear').classList.toggle('open');$('#adminToggle').onclick=()=>$('#admin').classList.toggle('open');document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{const g=b.dataset.gear;if(!state.gear.has(g)){toast('Bu gear hali ochilmagan');return}state.selected=g;$('#selectedLabel').textContent=g;b.classList.add('active');document.querySelectorAll('[data-gear]').forEach(x=>{if(x!==b)x.classList.remove('active')});if(g!=='slap')action(g)});document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send({type:'admin',token:$('#adminToken').value,command:b.dataset.command,target:$('#adminTarget').value}));$('#announce').onclick=()=>send({type:'admin',token:$('#adminToken').value,command:'announce',message:$('#announcement').value});addEventListener('keydown',e=>{state.keys[e.key.toLowerCase()]=true;if(e.key==='ArrowLeft')state.yaw-=.12;if(e.key==='ArrowRight')state.yaw+=.12});addEventListener('keyup',e=>{state.keys[e.key.toLowerCase()]=false});$('#rotL').onclick=()=>state.yaw-=Math.PI/6;$('#rotR').onclick=()=>state.yaw+=Math.PI/6;bindJoystick();setupScene();setTimeout(connect,300);
</script>
</body>
</html>
