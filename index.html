<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--surface:#fff;--raised:#eef0f3;--text:#14171c;--muted:#5b6470;--line:#e3e6ea;--accent:#3db8a5;--on-accent:#06231f;--input:#868e98;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101317;--surface:#1a1f26;--raised:#232a33;--text:#f2f4f7;--muted:#a5afbb;--line:#2e3640;--input:#7a8694}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/24px Inter,Roboto,system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
.off{display:none!important}
button{font:600 15px/22px inherit;font-family:inherit;color:var(--text);background:var(--raised);border:0;border-radius:12px;min-height:48px;min-width:48px;padding:0 14px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);border-radius:12px;min-height:48px;padding:0 18px;font-weight:700;text-decoration:none;border:0;width:100%;box-sizing:border-box}
.btn:disabled{opacity:.45}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px;box-sizing:border-box;position:relative;z-index:2}
#title{flex:1;font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
#splash{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity 400ms}
#splash.hide{opacity:0;pointer-events:none}
#splash svg{width:min(82vw,440px);height:auto}
.lg-b{fill:var(--text)}.lg-d{fill:var(--accent)}
#seg{display:flex;flex:1;justify-content:center}
#seg div{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#seg button{background:none;border-radius:999px;min-height:40px}
#seg button[aria-pressed=true]{background:var(--raised)}
#coins{background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
#sbtn{background:var(--surface);border-radius:999px}
#search{padding:0 12px 8px;position:relative;z-index:2}
#q{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--input);background:var(--surface);color:var(--text);font:inherit;padding:0 12px}
#pg-me{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:-56px}
#stage{flex:1;min-height:0;position:relative;background:linear-gradient(160deg,#e6e29a,#e9c6d6 55%,#c9aee0)}
#stage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#333;padding:24px;text-align:center}
#sheet{background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;height:150px;overflow:hidden;transition:height 200ms cubic-bezier(.2,.8,.2,1)}
#sheet.x{height:50%}#sheet.f{height:calc(100% - 56px)}#sheet.drag{transition:none}
#grab{height:40px;min-height:40px;touch-action:none;width:100%;background:none;border-radius:0;display:flex;align-items:center;justify-content:center}
#grab i{width:40px;height:4px;border-radius:2px;background:var(--input)}
#tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
#tabs button{background:none;border-radius:0;color:var(--muted);border-bottom:3px solid transparent;flex:none}
#tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
#act{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
#act b{flex:1}#act .btn{width:auto;flex:none}
#grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:max-content;gap:8px;padding:12px;align-content:start}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:var(--raised);height:auto;border:2px solid transparent;font-size:13px;min-height:104px}
.card[aria-pressed=true]{border-color:var(--accent)}
.card small{color:var(--muted);font-weight:500}.card small.on{color:var(--text);font-weight:700}
.dot{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);display:block}
.bgp{width:56px;height:44px;border-radius:10px;display:block;border:1px solid var(--line)}
.em{font-size:32px;line-height:44px}
.empty{grid-column:1/-1;color:var(--muted);padding:16px}
.card{align-items:stretch;text-align:left;background:none;padding:0;gap:3px;min-height:0;border:0;font-size:15px}.card[aria-pressed=true]{border:0}
.th{width:100%;height:min(calc((100vw - 40px)/3),170px);border-radius:14px;background:var(--raised);display:flex;align-items:center;justify-content:center;border:3px solid transparent;box-sizing:border-box;overflow:hidden}
.card[aria-pressed=true] .th{border-color:var(--accent)}
.th .dot{width:68px;height:68px;border-radius:34px}.th .bgp{width:100%;height:100%;border:0;border-radius:0}.th .em{font-size:52px;line-height:1}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.cr{color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-weight:700;font-size:15px}.vf{display:inline-block;background:#2f6df5;color:#fff;font-style:normal;font-size:11px;line-height:16px;width:16px;text-align:center;border-radius:4px}
.sec{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-top:6px}.sec h3{margin:0;font-size:22px}
.pill{min-height:40px;background:none;border:1.5px solid var(--text);border-radius:8px;font-size:15px;padding:0 12px}
.pg{flex:1;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px}
.game{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);height:auto;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gt{width:72px;height:72px;border-radius:14px;flex:none;display:block;overflow:hidden}
.gt svg,.th2 svg,#gban svg{width:100%;height:100%;display:block}
#gban{overflow:hidden}
.me{display:flex;align-items:center;gap:12px;padding:4px 0}.me b{display:block;font-size:20px;line-height:26px}.me small{color:var(--muted);font-size:14px;font-weight:500}
.avc{width:56px;height:56px;border-radius:28px;overflow:hidden;display:block;flex:none;border:1px solid var(--line)}.avc svg{width:100%;height:100%;display:block}
.sh{font-size:22px;margin:10px 0 0;line-height:28px}
.big,.sm{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:none;padding:0;height:auto;gap:2px}
.big b,.sm b{font-size:17px;margin-top:6px}.big small,.sm small{color:var(--muted);font-weight:500;font-size:14px}
.th2{display:block;width:100%;border-radius:14px;overflow:hidden}
.big .th2{height:min(calc((100vw - 24px)*.5625),240px)}.sm .th2{height:min(calc((100vw - 36px)*.28),140px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game div{flex:1;display:flex;flex-direction:column}.game small{color:var(--muted);font-weight:500}
.rk{font-size:20px;font-weight:800;width:28px;text-align:center}
#gpage{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;gap:12px;padding:12px;box-sizing:border-box;overflow-y:auto;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#gban{height:180px;border-radius:20px;flex:none}
#gpage h2{margin:0}#gpage p{margin:0;color:var(--muted)}
#nav{display:flex;background:var(--surface);border-top:1px solid var(--line)}
#nav button{flex:1;background:none;border-radius:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;font-size:13px;line-height:16px}
#nav button[aria-current=page]{color:var(--text);box-shadow:inset 0 3px 0 var(--accent)}
#nav span{font-size:20px;line-height:24px}
.fa{display:flex;flex-direction:column;gap:10px}.fh{color:var(--muted);font-size:14px;margin:0}
.fl{font-size:14px;font-weight:600;margin-top:4px}
.fi{height:48px;box-sizing:border-box;border-radius:12px;border:1px solid var(--input);background:var(--surface);color:var(--text);font:inherit;padding:0 12px;width:100%}
.fm{min-height:20px;font-size:14px;color:var(--text);font-weight:600}
.fx{background:none;color:var(--muted);min-height:44px;font-weight:600}
.fs{font-size:14px;color:var(--muted);margin:10px 0 0;font-weight:600}
.fr{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fr b{flex:1;overflow:hidden;text-overflow:ellipsis}.fb{display:flex;gap:4px;align-items:center}.fb .btn{width:auto;min-height:40px;padding:0 14px}
.fadd{display:flex;gap:8px}.fadd .btn{width:auto;flex:none}
</style>
